project:
  name: "Malnutrition Research Automation"
  version: "1.0"

data:
  input_file: "E:/Research_Automation/data/malnutrition_practice_dataset.csv"
  cleaned_file: "E:/Research_Automation/data/cleaned_malnutrition_dataset.csv"
  final_file: "E:/Research_Automation/data/final_malnutrition_dataset.csv"

variables:

  id:
    - child_id

  numeric:
    - age_months
    - birth_weight
    - dietary_diversity
    - maternal_bmi

  categorical:
    - sex
    - mother_education
    - wealth_index
    - urban_rural
    - sanitation
    - water_source
    - immunization

  outcomes:
    - stunting
    - wasting
    - underweight

analysis:

  correlation_threshold: 0.70

  vif_threshold: 5

  test_size: 0.20

  random_state: 42

  confidence_level: 0.95

output:

  results_dir: "E:/Research_Automation/results"

  tables_dir: "E:/Research_Automation/results/tables"

  figures_dir: "E:/Research_Automation/results/figures"

  models_dir: "E:/Research_Automation/results/models"

  reports_dir: "E:/Research_Automation/reports"